kind = "web"
previewPath = "/"
title = "HoneyPort Analyzer Simulator"
version = "1.0.0"
id = "artifacts/honeyport"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25319

[services.development]
run = "pnpm --filter @workspace/honeyport run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/honeyport", "run", "build" ]
serve = "static"
publicDir = "artifacts/honeyport/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25319"
BASE_PATH = "/"
